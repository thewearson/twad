<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>THE WEARS ON STUDIO</title>
  <style>
    :root {
      --ink: #000;
      --paper: #fff;
      --ink54: rgba(0, 0, 0, 0.54);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }
    h1 {
      margin: 0;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 0.95;
      text-transform: uppercase;
    }
    p {
      margin: 18px 0 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink54);
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>THE WEARS ON<br>STUDIO</h1>
      <p>Editor · admin only</p>
    </div>
  </main>
</body>
</html>
